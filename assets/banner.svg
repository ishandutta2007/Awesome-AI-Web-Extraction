<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".8"/><stop offset="50%" stop-color="#a855f7" stop-opacity=".8"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".8"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><filter id="blur-filter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur stdDeviation="40"/></filter><filter id="glow-light"><feGaussianBlur result="coloredBlur" stdDeviation="8"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes floatParticle1{0%{transform:translate(0,0) scale(1);opacity:.4}50%{transform:translate(30px,-20px) scale(1.1);opacity:.8}}@keyframes floatParticle2{0%{transform:translate(0,0) scale(1);opacity:.3}50%{transform:translate(-25px,25px) scale(1.2);opacity:.7}}@keyframes pulseGrid{0%{opacity:.15}50%{opacity:.35}}@keyframes dashData{0%{stroke-dashoffset:100}}.subtitle-text,.tag-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:54px;fill:#fff;letter-spacing:-1px}.subtitle-text{font-weight:500;font-size:22px;fill:#94a3b8;letter-spacing:0}.tag-text{font-weight:600;font-size:13px;fill:#38bdf8;letter-spacing:1px}.particle-1{animation:floatParticle1 8s ease-in-out infinite}.particle-2{animation:floatParticle2 10s ease-in-out infinite}.grid-bg{animation:pulseGrid 6s ease-in-out infinite}.data-line{stroke-dasharray:10,10;animation:dashData 20s linear infinite}</style></defs>