<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="glow-light">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 54px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 22px;
        fill: #94a3b8;
        letter-spacing: 0px;
      }
      .tag-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
        letter-spacing: 1px;
      }
      
      /* Dynamic animations */
      @keyframes floatParticle1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
        50% { transform: translate(30px, -20px) scale(1.1); opacity: 0.8; }
      }
      @keyframes floatParticle2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
        50% { transform: translate(-25px, 25px) scale(1.2); opacity: 0.7; }
      }
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      @keyframes dashData {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      .particle-1 { animation: floatParticle1 8s ease-in-out infinite; }
      .particle-2 { animation: floatParticle2 10s ease-in-out infinite; }
      .grid-bg { animation: pulseGrid 6s ease-in-out infinite; }
      .data-line { stroke-dasharray: 10, 10; animation: dashData 20s linear infinite; }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/>

  <!-- Background Glowing Orbs (Dynamic background elements, non-blocking) -->
  <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.25" filter="url(#blur-filter)" class="particle-1"/>
  <circle cx="1050" cy="270" r="160" fill="#ec4899" opacity="0.2" filter="url(#blur-filter)" class="particle-2"/>
  <circle cx="600" cy="175" r="180" fill="#06b6d4" opacity="0.15" filter="url(#blur-filter)"/>

  <!-- Tech Grid Background Pattern -->
  <g class="grid-bg" stroke="#ffffff" stroke-width="1" opacity="0.15">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300" />
    <path d="M 100,0 L 100,350 M 200,0 L 200,350 M 300,0 L 300,350 M 400,0 L 400,350 M 500,0 L 500,350 M 600,0 L 600,350 M 700,0 L 700,350 M 800,0 L 800,350 M 900,0 L 900,350 M 1000,0 L 1000,350 M 1100,0 L 1100,350" />
  </g>

  <!-- Animated Data Flow Lines in Background -->
  <path d="M 50,280 Q 300,320 600,280 T 1150,290" fill="none" stroke="url(#primary-glow)" stroke-width="3" class="data-line" opacity="0.6"/>
  <path d="M 50,70 Q 400,20 800,70 T 1150,50" fill="none" stroke="url(#cyan-glow)" stroke-width="2" class="data-line" opacity="0.5"/>

  <!-- Decorative Abstract Extraction Node Graphics (Right Side) -->
  <g transform="translate(920, 100)" opacity="0.85">
    <!-- Web Page Frame -->
    <rect x="0" y="0" width="180" height="130" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="15" cy="15" r="4" fill="#ef4444"/>
    <circle cx="30" cy="15" r="4" fill="#f59e0b"/>
    <circle cx="45" cy="15" r="4" fill="#10b981"/>
    <!-- Code / Data lines -->
    <rect x="15" y="35" width="90" height="8" rx="4" fill="#38bdf8"/>
    <rect x="15" y="52" width="140" height="6" rx="3" fill="#64748b"/>
    <rect x="15" y="66" width="110" height="6" rx="3" fill="#64748b"/>
    <rect x="15" y="80" width="130" height="6" rx="3" fill="#64748b"/>

    <!-- Arrow / Transformation to Structured Data -->
    <path d="M 90,135 L 90,165" stroke="#a855f7" stroke-width="3" stroke-dasharray="4,4" filter="url(#glow-light)"/>
    
    <!-- JSON / Markdown Output Box -->
    <rect x="25" y="170" width="130" height="65" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2" filter="url(#glow-light)"/>
    <text x="40" y="195" font-family="monospace" font-size="12" fill="#38bdf8">{ "llm": true }</text>
    <text x="40" y="215" font-family="monospace" font-size="12" fill="#4ade80"># Markdown</text>
  </g>

  <!-- Foreground Content Block (High contrast, clearly visible) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="16" y="21" class="tag-text">🚀 CURATED AI &amp; RAG ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text" filter="url(#glow-light)">
      Awesome AI Web Extraction 🕸️🤖
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="195" class="subtitle-text">
      Top SaaS Platforms &amp; Open-Source Repos for LLM-Ready Web Scraping,
    </text>
    <text x="0" y="225" class="subtitle-text">
      Crawl-to-Markdown, Structured Parsing &amp; RAG Data Pipelines.
    </text>

    <!-- Decorative Bottom Accent Line -->
    <rect x="0" y="260" width="540" height="4" rx="2" fill="url(#primary-glow)"/>
  </g>
</svg>
